    <script>
        // ── L'aiguillage ───────────────────────────────────────────
        // Dans le <head>, AVANT tout le reste : sur un téléphone, la page ne
        // doit pas avoir le temps de s'afficher. GitHub Pages ne sait pas
        // rediriger côté serveur, c'est donc ici que tout se joue.
        // ⚠️ `replace` et non `href` : sinon le retour depuis le store revient
        // sur cette page, qui renvoie aussitôt au store — on ne ressort plus.
        // ⚠️ Un iPad sous iPadOS se présente comme un Mac : c'est le tactile
        // qui le trahit. Un vrai Mac n'a pas d'écran tactile.
        // `?liens` garde la page affichée, pour la vérifier depuis un téléphone.
        (function () {
            var fr = (navigator.language || 'fr').toLowerCase().indexOf('fr') === 0;
            var ua = navigator.userAgent;
            var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
            var android = /Android/i.test(ua);
            if (/[?&]liens\b/.test(location.search)) return;
            if (ios) location.replace(fr ? 'https://apps.apple.com/fr/app/climbr-progression-escalade/id6803155208' : 'https://apps.apple.com/app/climbr-bouldering-progress/id6803155208');
            else if (android) location.replace('https://play.google.com/store/apps/details?id=com.athanorstudio.climb&hl=' + (fr ? 'fr' : 'en'));
        })();
    </script>
