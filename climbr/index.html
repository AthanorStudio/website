<!DOCTYPE html>
<html lang="fr">
<head>
    <!-- ⚠️ Climbr s'appelle Bouldr depuis le 2 novembre 2026. Tout /climbr/ renvoie
         vers /bouldr/ en GARDANT les paramètres : l'app envoie encore des liens
         /climbr/ami/?de=…&nom=…, et les liens déjà partagés doivent tomber juste.
         L'aperçu (og) est porté ici aussi : une messagerie lit CETTE page, pas la cible.
         GitHub Pages ne fait pas de vraie redirection 301 : d'où le JS + meta refresh. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouldr — Ton carnet de bloc</title>
    <meta name="robots" content="noindex">
    <link rel="canonical" href="https://athanor-studio.io/bouldr/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Bouldr">
    <meta property="og:url" content="https://athanor-studio.io/bouldr/">
    <meta property="og:title" content="Bouldr — Ton carnet de bloc">
    <meta property="og:image" content="https://athanor-studio.io/bouldr/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://athanor-studio.io/bouldr/og-image.png">
    <script>location.replace(location.pathname.replace(/^\/climbr(?=\/|$)/, '/bouldr') + location.search + location.hash);</script>
    <meta http-equiv="refresh" content="0; url=/bouldr/">
</head>
<body>
    <p><a href="/bouldr/">Bouldr</a></p>
</body>
</html>
