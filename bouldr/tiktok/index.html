<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Télécharger Bouldr</title>
    <meta name="robots" content="noindex">
    <link rel="canonical" href="https://athanor-studio.io/bouldr/download/">
    <script>
        // ── Le lien de la bio TikTok ───────────────────────────────
        // Même aiguillage que /bouldr/download/, mais vers les liens de suivi
        // Tenjin (channel « TikTok Organic ») au lieu des stores en direct :
        // c'est ce qui sort ces installations d'« Organic ».
        // ⚠️ Un lien Tenjin vaut pour UNE app, et Tenjin en compte deux (iPhone,
        // Android) : d'où ce tri, une bio n'acceptant qu'un seul lien.
        // ⚠️ `replace` et non `href` : sinon le retour depuis le store revient
        // ici, qui renvoie aussitôt au store — on ne ressort plus.
        // ⚠️ Un iPad se déclare Mac : c'est le tactile qui le trahit.
        // Un ordinateur part sur /bouldr/download/ (badges + QR code).
        // `?liens` garde la page affichée, pour la vérifier depuis un téléphone.
        (function () {
            var ua = navigator.userAgent;
            var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
            var android = /Android/i.test(ua);
            if (/[?&]liens\b/.test(location.search)) return;
            if (ios) location.replace('https://track.tenjin.com/v0/click/eet9Snds0pwdUi47BoXNLr');
            else if (android) location.replace('https://track.tenjin.com/v0/click/gqrsqeujWpSSGH3UYQgyTl');
            else location.replace('/bouldr/download/');
        })();
    </script>
