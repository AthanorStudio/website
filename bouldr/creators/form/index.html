    <style>
        .postuler { padding: calc(84px + clamp(1.5rem, 4vw, 3rem)) 0 var(--section-padding); }
        .colonne { max-width: 38rem; margin: 0 auto; padding: 0 var(--container-padding); }
        .postuler h1 { font-size: clamp(1.9rem, 5vw, 2.6rem); font-weight: 800; letter-spacing: var(--letter-tight); line-height: 1.1; text-wrap: balance; }
        .retour { display: inline-block; margin-bottom: 1.2rem; font-size: var(--fs-small); color: var(--ink-soft); }
        .retour:hover { color: var(--ink); }

        /* Une question par carte : le formulaire d'une seule grille dense se
           lisait comme de l'administratif (retour du 4 oct. 2026). */
        .form { margin-top: 1.75rem; display: flex; flex-direction: column; gap: 0.9rem; }
        .carte { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 1.25rem 1.3rem; transition: border-color var(--transition); }
        .carte.invalide { border-color: var(--accent); }
        .question { display: block; font-size: 0.9375rem; font-weight: 600; margin-bottom: 0.75rem; }
        .question em { font-style: normal; font-weight: 400; color: var(--muted); }
        .question .req { color: var(--accent); }
        .aide { font-size: var(--fs-small); color: var(--ink-soft); margin: -0.4rem 0 0.75rem; }
        .deux { display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem; }
        .deux .question { margin-bottom: 0.45rem; }
        input[type="text"], input[type="email"], input[type="tel"], select { font: inherit; font-size: 1rem; color: var(--ink); background: var(--surface-raised); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 0.7rem 0.85rem; width: 100%; min-width: 0; transition: border-color var(--transition); }
        input:focus, select:focus { outline: none; border-color: var(--accent); }

        /* Les comptes : une ligne par réseau, au moins une. */
        .comptes { display: flex; flex-direction: column; gap: 0.55rem; }
        .compte { display: grid; grid-template-columns: 8.5rem minmax(0, 1fr) 2.5rem; gap: 0.5rem; align-items: center; }
        .arobase { position: relative; }
        .arobase::before { content: '@'; position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%); color: var(--muted); }
        .arobase input { padding-left: 1.8rem; }
        .retirer { width: 2.5rem; height: 2.5rem; border: 0; background: none; color: var(--muted); font-size: 1.3rem; cursor: pointer; border-radius: 50%; }
        .retirer:hover { color: var(--accent); background: var(--bg); }
        .retirer[disabled] { visibility: hidden; }
        .ajouter { margin-top: 0.75rem; border: 0; background: none; font: inherit; font-size: var(--fs-small); font-weight: 600; color: var(--accent); cursor: pointer; padding: 0; }
        .ajouter:hover { color: var(--accent-dark); }
        .tel-ligne { display: grid; grid-template-columns: 5rem minmax(0, 1fr); gap: 0.5rem; }

        .consent { display: flex; gap: 0.75rem; align-items: flex-start; cursor: pointer; font-size: var(--fs-small); color: var(--ink-soft); }
        .consent input { width: 1.15rem; height: 1.15rem; margin-top: 0.1rem; accent-color: var(--accent); flex: none; }
        .consent a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }

        /* ⚠️ Le pot de miel : FormSubmit jette tout message où il est rempli.
           Pas display:none, que certains robots savent sauter. */
        .miel { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
        .envoyer { padding: 1rem 1.4rem; font-size: 1rem; width: 100%; }
        .envoyer[disabled] { opacity: 0.6; cursor: wait; transform: none; }
        .etat { font-size: var(--fs-small); color: var(--ink-soft); min-height: 1.2em; text-align: center; }
        .etat.erreur { color: var(--accent-dark); }

        @media (max-width: 520px) {
            .deux { grid-template-columns: 1fr; }
            .compte { grid-template-columns: 7rem minmax(0, 1fr) 2.25rem; }
        }
    </style>

    <main class="postuler">
        <div class="colonne" id="bloc">
            <a href="../" class="retour" data-t="retour">← Le programme créateurs</a>
            <h1 data-t="titre">Rejoins les créateurs Bouldr</h1>

            <form class="form" id="form" novalidate>
                <div class="carte deux" data-requis="nom">
                    <div><label class="question" for="prenom"><span data-t="q.prenom">Prénom</span> <span class="req">*</span></label><input type="text" id="prenom" name="prenom" autocomplete="given-name" data-t-ph="ph.prenom" placeholder="Ton prénom"></div>
                    <div><label class="question" for="nom"><span data-t="q.nom">Nom</span> <span class="req">*</span></label><input type="text" id="nom" name="nom" autocomplete="family-name" data-t-ph="ph.nom" placeholder="Ton nom"></div>
                </div>

                <div class="carte" data-requis="email">
                    <label class="question" for="email"><span data-t="q.email">E-mail</span> <span class="req">*</span></label>
                    <input type="email" id="email" name="email" autocomplete="email" data-t-ph="ph.email" placeholder="toi@exemple.com">
                </div>

                <div class="carte" data-requis="whatsapp">
                    <label class="question" for="numero"><span data-t="q.whatsapp">WhatsApp</span> <span class="req">*</span></label>
                    <p class="aide" data-t="aide.whatsapp">Si tu es d'accord, on crée un groupe avec l'équipe pour faciliter la communication.</p>
                    <div class="tel-ligne">
                        <input type="tel" id="indicatif" name="indicatif" value="+33" aria-label="Indicatif" autocomplete="tel-country-code">
                        <input type="tel" id="numero" name="numero" autocomplete="tel-national" data-t-ph="ph.numero" placeholder="6 12 34 56 78">
                    </div>
                </div>

                <div class="carte" data-requis="comptes">
                    <span class="question"><span data-t="q.comptes">Ton compte</span> <span class="req">*</span></span>
                    <div class="comptes" id="comptes"></div>
                    <button type="button" class="ajouter" id="ajouter" data-t="ajouter">+ Ajouter un compte</button>
                </div>

                <div class="carte">
                    <label class="question" for="salle"><span data-t="q.salle">La salle où tu as l'habitude de grimper</span> <em data-t="facultatif">(facultatif)</em></label>
                    <input type="text" id="salle" name="salle" data-t-ph="ph.salle" placeholder="Arkose Montreuil">
                </div>

                <div class="carte" data-requis="consent">
                    <label class="consent"><input type="checkbox" id="consent" name="consent" value="oui"><span data-t="consent">J'accepte qu'Athanor Studio, l'éditeur de Bouldr, me recontacte par e-mail et WhatsApp au sujet du programme créateurs et traite mes informations dans ce cadre. <a href="../../../privacy.html" target="_blank" rel="noopener">Confidentialité</a></span></label>
                </div>

                <div class="miel" aria-hidden="true"><label for="_honey">Ne pas remplir</label><input type="text" id="_honey" name="_honey" tabindex="-1" autocomplete="off"></div>
                <button class="btn btn-primary envoyer" type="submit" data-t="envoyer">Voir mon contrat</button>
                <p class="etat" id="etat" role="status"></p>
            </form>

        </div>
    </main>

    <template id="modele-compte">
        <div class="compte">
            <select name="reseau" aria-label="Réseau">
                <option value="Instagram" selected>Instagram</option>
                <option value="TikTok">TikTok</option>
            </select>
            <div class="arobase"><input type="text" name="pseudo" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Pseudo"></div>
            <button type="button" class="retirer" aria-label="Retirer ce compte">×</button>
        </div>
    </template>

    <script>
        // ── La langue ──────────────────────────────────────────────
        // Même clé que /bouldr et /bouldr/creators (`climbr-lang`). Le français
        // est dans le HTML, lu au chargement : un seul endroit à changer.
        const EN = {
            'retour': '← The creator program',
            'titre': 'Join the Bouldr creators',
            'q.prenom': 'First name', 'q.nom': 'Last name', 'q.email': 'Email',
            'q.whatsapp': 'WhatsApp', 'aide.whatsapp': 'If you\'re up for it, we\'ll set up a group with the team to make communication easier.',
            'q.comptes': 'Your account', 'ajouter': '+ Add an account',
            'q.salle': 'The gym where you usually climb', 'facultatif': '(optional)',
            'consent': 'I agree that Athanor Studio, the publisher of Bouldr, may contact me by email and WhatsApp about the creator program and process my information for that purpose. <a href="../../../privacy.html" target="_blank" rel="noopener">Privacy</a>',
            'envoyer': 'See my agreement'
        };
        const EN_PH = { 'ph.prenom': 'Your first name', 'ph.nom': 'Your last name', 'ph.email': 'you@example.com', 'ph.numero': '7700 900123', 'ph.salle': 'The Castle' };
        const MSG = {
            fr: { manque: 'Il manque des réponses : elles sont entourées.', envoi: 'Envoi…', erreur: 'L\'envoi n\'est pas passé. Réessaie, ou écris-nous à contact@athanor-studio.io.', titre: 'Bouldr — Postuler au programme créateurs', aria: 'Switch to English', pseudo: 'pseudo' },
            en: { manque: 'Some answers are missing: they\'re highlighted.', envoi: 'Sending…', erreur: 'Sending failed. Try again, or email us at contact@athanor-studio.io.', titre: 'Bouldr — Apply to the creator program', aria: 'Passer en français', pseudo: 'handle' }
        };
        const FR = {}, FR_PH = {};
        document.querySelectorAll('[data-t]').forEach(el => { FR[el.dataset.t] = el.innerHTML; });
        document.querySelectorAll('[data-t-ph]').forEach(el => { FR_PH[el.dataset.tPh] = el.placeholder; });

        // `?lang=en` (ou `fr`) dans le lien passe avant tout : un lien envoyé à un
        // créateur anglophone s'ouvre en anglais, quelle que soit la langue de
        // son téléphone. Le choix est ensuite gardé comme un clic sur EN/FR.
        let langue = new URLSearchParams(location.search).get('lang');
        if (langue !== 'fr' && langue !== 'en') { try { langue = localStorage.getItem('climbr-lang'); } catch (e) {} }
        if (langue !== 'fr' && langue !== 'en') langue = (navigator.language || 'fr').toLowerCase().startsWith('fr') ? 'fr' : 'en';
        function appliquer() {
            const d = langue === 'en' ? EN : FR, ph = langue === 'en' ? EN_PH : FR_PH;
            document.documentElement.lang = langue;
            document.title = MSG[langue].titre;
            document.querySelectorAll('[data-t]').forEach(el => { if (d[el.dataset.t] !== undefined) el.innerHTML = d[el.dataset.t]; });
            document.querySelectorAll('[data-t-ph]').forEach(el => { if (ph[el.dataset.tPh] !== undefined) el.placeholder = ph[el.dataset.tPh]; });
            document.querySelectorAll('input[name="pseudo"]').forEach(el => { el.placeholder = MSG[langue].pseudo; });
            document.querySelector('.lang-toggle-label').textContent = langue === 'fr' ? 'EN' : 'FR';
            document.querySelector('.lang-toggle').setAttribute('aria-label', MSG[langue].aria);
            try { localStorage.setItem('climbr-lang', langue); } catch (e) {}
            // L'adresse suit la langue affichée : copiée telle quelle, elle rouvre la même version.
            try { const u = new URL(location.href); u.searchParams.set('lang', langue); history.replaceState(null, '', u); } catch (e) {}
        }
        document.querySelector('.lang-toggle').addEventListener('click', () => { langue = langue === 'fr' ? 'en' : 'fr'; appliquer(); });

        // ── Les comptes ────────────────────────────────────────────
        const liste = document.getElementById('comptes');
        const modele = document.getElementById('modele-compte');
        function rafraichir() {
            const lignes = liste.querySelectorAll('.compte');
            lignes.forEach(l => { l.querySelector('.retirer').disabled = lignes.length === 1; });
            // Deux réseaux, deux lignes : au-delà, le bouton n'aurait rien à ajouter.
            document.getElementById('ajouter').hidden = lignes.length >= 2;
        }
        function ajouter() {
            const ligne = modele.content.firstElementChild.cloneNode(true);
            const deja = [...liste.querySelectorAll('select')].map(s => s.value);
            if (deja.includes('TikTok')) ligne.querySelector('select').value = 'Instagram';
            ligne.querySelector('input').placeholder = MSG[langue].pseudo;
            ligne.querySelector('.retirer').addEventListener('click', () => { ligne.remove(); rafraichir(); });
            liste.appendChild(ligne);
            rafraichir();
            return ligne;
        }
        document.getElementById('ajouter').addEventListener('click', () => ajouter().querySelector('input').focus());
        ajouter();

        appliquer();

        // ── L'envoi ────────────────────────────────────────────────
        // FormSubmit relaie vers climbr@ (activé le 4 oct. 2026).
        const form = document.getElementById('form');
        const etat = document.getElementById('etat');
        const comptes = () => [...liste.querySelectorAll('.compte')]
            .map(l => ({ reseau: l.querySelector('select').value, pseudo: l.querySelector('input').value.trim().replace(/^@+/, '') }))
            .filter(c => c.pseudo);
        const CONTROLES = {
            nom: () => form.prenom.value.trim() && form.nom.value.trim(),
            email: () => form.email.value.trim() && form.email.checkValidity(),
            whatsapp: () => form.numero.value.replace(/\D/g, '').length >= 6,
            comptes: () => comptes().length > 0,
            consent: () => form.consent.checked
        };
        // Une carte entourée se libère dès qu'on y répond (`input` part aussi
        // des boutons radio, des cases et des menus).
        form.addEventListener('input', (e) => {
            const carte = e.target.closest('.carte.invalide');
            if (carte && CONTROLES[carte.dataset.requis]()) carte.classList.remove('invalide');
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const m = MSG[langue];
            etat.classList.remove('erreur');
            const manquantes = [...form.querySelectorAll('[data-requis]')].filter(c => !CONTROLES[c.dataset.requis]());
            form.querySelectorAll('.carte').forEach(c => c.classList.toggle('invalide', manquantes.includes(c)));
            if (manquantes.length) {
                etat.textContent = m.manque; etat.classList.add('erreur');
                manquantes[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
                return;
            }
            const bouton = form.querySelector('.envoyer');
            bouton.disabled = true; etat.textContent = m.envoi;
            const liste_comptes = comptes().map(c => c.reseau + ' @' + c.pseudo).join(', ');
            const indicatif = form.indicatif.value.trim().replace(/^(?!\+)/, '+');
            const donnees = {
                prenom: form.prenom.value.trim(),
                nom: form.nom.value.trim(),
                email: form.email.value.trim(),
                whatsapp: indicatif + ' ' + form.numero.value.trim(),
                comptes: liste_comptes,
                salle: form.salle.value.trim(),
                langue_de_la_page: langue,
                consentement: 'oui',
                _honey: form._honey.value,
                _subject: 'Créateur Bouldr : ' + form.prenom.value.trim() + ' ' + form.nom.value.trim(),
                _replyto: form.email.value.trim(),
                _template: 'table'
            };
            // Copie vers le dashboard (onglet Créateurs) : la candidature y arrive
            // en fiche. Partie AVANT FormSubmit, attendue seulement s'il échoue.
            // ⚠️ Le 4 nov. 2026, FormSubmit est tombé (erreur 522 sur tout le
            // domaine) et chaque candidature finissait en « L'envoi n'est pas
            // passé » alors que le dashboard l'avait reçue : il suffit désormais
            // que l'un des deux l'ait.
            const versDashboard = fetch(location.hostname === 'localhost' ? 'http://localhost:3123/api/candidature' : 'https://climbr-dashboard.vercel.app/api/candidature', {
                method: 'POST', keepalive: true,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(Object.assign({ type: 'candidature', langue: langue, comptes_liste: comptes() }, donnees))
            }).then(r => r.ok, () => false);
            try {
                let parti = false;
                try {
                    // ⚠️ Borné : FormSubmit en panne met vingt secondes à échouer.
                    const r = await fetch('https://formsubmit.co/ajax/climbr@athanor-studio.io', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        body: JSON.stringify(donnees),
                        signal: window.AbortSignal && AbortSignal.timeout ? AbortSignal.timeout(15000) : undefined
                    });
                    const j = await r.json().catch(() => ({}));
                    // ⚠️ FormSubmit répond 200 même quand il refuse : c'est `success`
                    // qui dit si le message est parti (il vaut la chaîne "true").
                    parti = r.ok && String(j.success) === 'true';
                } catch (e) {}
                if (!parti) parti = await Promise.race([versDashboard, new Promise(ok => setTimeout(() => ok(false), 15000))]);
                if (!parti) throw new Error('aucun envoi');
                // Le contrat, ouvert juste après, reprend ce qui vient d'être saisi.
                // ⚠️ `sessionStorage` : ces données ne restent que dans cet onglet,
                // le temps d'aller au contrat, jamais sur le téléphone.
                try { sessionStorage.setItem('climbr-candidature', JSON.stringify({ prenom: donnees.prenom, nom: donnees.nom, email: donnees.email, comptes: comptes().map(c => '@' + c.pseudo + ' (' + c.reseau + ')').join(', ') })); } catch (e) {}
                // La candidature partie, on ouvre le contrat, dans la même langue.
                location.assign('../contrat/?lang=' + langue);
            } catch (err) {
                etat.textContent = m.erreur; etat.classList.add('erreur');
                bouton.disabled = false;
            }
        });

        const nav = document.querySelector('.nav');
        window.addEventListener('scroll', () => nav.classList.toggle('scrolled', window.scrollY > 20), { passive: true });
    </script>
